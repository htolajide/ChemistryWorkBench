<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry Workbench Pro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/darktheme.css">
    <link rel="stylesheet" href="css/animations.css">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">⚗️</span>
                <h1>Chemistry Workbench Pro</h1>
            </div>
            <div class="header-controls">
                <button id="theme-toggle" class="btn-icon" title="Toggle Theme">🌓</button>
                <button id="notebook-btn" class="btn-icon" title="Experiment Notebook">📓</button>
                <button id="export-btn" class="btn-icon" title="Export Data">💾</button>
            </div>
        </header>

        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Left Sidebar - Reagent Shelf -->
            <aside class="sidebar left-sidebar">
                <div class="panel">
                    <h3>🧪 Reagent Shelf</h3>
                    <div class="search-box">
                        <input type="text" id="reagent-search" placeholder="Search reagents...">
                    </div>
                    <div class="reagent-list" id="reagent-list">
                        <!-- Reagents will be populated by JavaScript -->
                    </div>
                </div>

                <div class="panel">
                    <h3>🧫 Glassware</h3>
                    <div class="glassware-grid">
                        <div class="glassware-item" data-type="beaker">
                            <svg width="40" height="50" viewBox="0 0 40 50">
                                <path d="M5 10 L5 45 L35 45 L35 10 Z" fill="none" stroke="#666" stroke-width="2"/>
                                <ellipse cx="20" cy="10" rx="15" ry="3" fill="none" stroke="#666" stroke-width="2"/>
                            </svg>
                            <span>Beaker</span>
                        </div>
                        <div class="glassware-item" data-type="flask">
                            <svg width="40" height="50" viewBox="0 0 40 50">
                                <path d="M15 5 L15 20 L5 45 L35 45 L25 20 L25 5 Z" fill="none" stroke="#666" stroke-width="2"/>
                            </svg>
                            <span>Flask</span>
                        </div>
                        <div class="glassware-item" data-type="test-tube">
                            <svg width="20" height="50" viewBox="0 0 20 50">
                                <path d="M5 5 L5 40 Q5 45 10 45 Q15 45 15 40 L15 5" fill="none" stroke="#666" stroke-width="2"/>
                            </svg>
                            <span>Test Tube</span>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Center - Workbench -->
            <main class="workbench">
                <div class="toolbar">
                    <div class="toolbar-group">
                        <button class="tool-btn active" data-module="kinetics">⚡ Kinetics</button>
                        <button class="tool-btn" data-module="equilibrium">⚖️ Equilibrium</button>
                        <button class="tool-btn" data-module="titration">💧 Titration</button>
                        <button class="tool-btn" data-module="thermo">🔥 Thermo</button>
                        <button class="tool-btn" data-module="stoichiometry">🧮 Stoich</button>
                    </div>
                </div>

                <div class="workbench-area" id="workbench-area">
                    <!-- Dynamic content will be loaded here -->
                </div>

                <div class="results-panel">
                    <h3>📊 Results</h3>
                    <div id="results-content">
                        <p class="placeholder-text">Run a simulation to see results</p>
                    </div>
                </div>
            </main>

            <!-- Right Sidebar - Analysis -->
            <aside class="sidebar right-sidebar">
                <div class="panel">
                    <h3>📈 Analysis</h3>
                    <div id="chart-container">
                        <div id="plotly-chart"></div>
                    </div>
                </div>

                <div class="panel">
                    <h3>🔬 Calculations</h3>
                    <div id="calculations-panel">
                        <div class="calc-item">
                            <label>Concentration:</label>
                            <span id="calc-concentration">—</span>
                        </div>
                        <div class="calc-item">
                            <label>pH:</label>
                            <span id="calc-ph">—</span>
                        </div>
                        <div class="calc-item">
                            <label>Temperature:</label>
                            <span id="calc-temp">—</span>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h3>⚠️ Safety</h3>
                    <div id="safety-panel">
                        <div class="safety-item">
                            <span class="pictogram">☠️</span>
                            <span>Toxic</span>
                        </div>
                        <div class="safety-item">
                            <span class="pictogram">🔥</span>
                            <span>Flammable</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>

        <!-- Periodic Table Modal -->
        <div id="periodic-table-modal" class="modal">
            <div class="modal-content large">
                <span class="close">&times;</span>
                <h2>Interactive Periodic Table</h2>
                <div id="periodic-table-container"></div>
            </div>
        </div>

        <!-- Solution Preparation Modal -->
        <div id="solution-prep-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Solution Preparation</h2>
                <div class="form-group">
                    <label>Select Reagent:</label>
                    <select id="prep-reagent"></select>
                </div>
                <div class="form-group">
                    <label>Desired Concentration (M):</label>
                    <input type="number" id="prep-concentration" step="0.001">
                </div>
                <div class="form-group">
                    <label>Desired Volume (mL):</label>
                    <input type="number" id="prep-volume" step="1">
                </div>
                <button id="calculate-prep" class="btn-primary">Calculate</button>
                <div id="prep-results"></div>
            </div>
        </div>

        <!-- Notebook Modal -->
        <div id="notebook-modal" class="modal">
            <div class="modal-content large">
                <span class="close">&times;</span>
                <h2>📓 Experiment Notebook</h2>
                <div class="notebook-tabs">
                    <button class="tab-btn active" data-tab="experiments">Experiments</button>
                    <button class="tab-btn" data-tab="new">New Entry</button>
                </div>
                <div id="notebook-content"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/reagentDatabase.js"></script>
    <script src="js/periodicTable.js"></script>
    <script src="js/reactionEngine.js"></script>
    <script src="js/stoichiometry.js"></script>
    <script src="js/notebook.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
